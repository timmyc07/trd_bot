[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trd-bot"
version = "0.2.0"
description = "Public-market-data paper market maker with replay and persistent risk controls"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
feed = ["aiohttp==3.14.5"]
dev = ["pytest==9.1.1"]

[project.scripts]
trd-bot = "trd_bot.cli:main"

[tool.setuptools.packages.find]
include = ["trd_bot*"]

[tool.setuptools.package-data]
trd_bot = ["web/*", "fixtures/*.json"]
